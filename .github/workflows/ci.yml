name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一ブランチで新しいPushがあれば古い実行をキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Buildに必要なFirebase設定（実接続はしないためダミー値）
  NEXT_PUBLIC_FIREBASE_API_KEY: dummy-api-key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy-project
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
  NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  quality:
    name: Lint / Type Check / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Build
        run: npm run build

  test:
    name: Test (Firestore Emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Firebase Emulatorの実行にJavaが必要
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      # Emulatorバイナリをキャッシュして起動時間を短縮
      - name: Cache Firebase Emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('firebase.json') }}
          restore-keys: ${{ runner.os }}-firebase-emulators-

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      # Emulator上で全テスト（Unit + Integration）を実行する
      - name: Run tests
        run: firebase emulators:exec --only firestore --project ${{ env.NEXT_PUBLIC_FIREBASE_PROJECT_ID }} "npm run test:run"
